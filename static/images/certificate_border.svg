<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Outer corner ornaments -->
  <rect x="0" y="0" width="30" height="30" fill="#f4ebd9" stroke="#c98a2c" stroke-width="3"/>
  <rect x="60" y="0" width="30" height="30" fill="#f4ebd9" stroke="#c98a2c" stroke-width="3"/>
  <rect x="0" y="60" width="30" height="30" fill="#f4ebd9" stroke="#c98a2c" stroke-width="3"/>
  <rect x="60" y="60" width="30" height="30" fill="#f4ebd9" stroke="#c98a2c" stroke-width="3"/>

  <!-- Corner inner decorative diamonds -->
  <polygon points="15,5 25,15 15,25 5,15" fill="#8b3a2b"/>
  <polygon points="75,5 85,15 75,25 65,15" fill="#8b3a2b"/>
  <polygon points="15,65 25,75 15,85 5,75" fill="#8b3a2b"/>
  <polygon points="75,65 85,75 75,85 65,75" fill="#8b3a2b"/>

  <!-- Top, Bottom, Left, Right connecting border lines -->
  <line x1="30" y1="5" x2="60" y2="5" stroke="#c98a2c" stroke-width="3"/>
  <line x1="30" y1="15" x2="60" y2="15" stroke="#8b3a2b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="30" y1="25" x2="60" y2="25" stroke="#c98a2c" stroke-width="2"/>

  <line x1="30" y1="65" x2="60" y2="65" stroke="#c98a2c" stroke-width="2"/>
  <line x1="30" y1="75" x2="60" y2="75" stroke="#8b3a2b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="30" y1="85" x2="60" y2="85" stroke="#c98a2c" stroke-width="3"/>

  <line x1="5" y1="30" x2="5" y2="60" stroke="#c98a2c" stroke-width="3"/>
  <line x1="15" y1="30" x2="15" y2="60" stroke="#8b3a2b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="25" y1="30" x2="25" y2="60" stroke="#c98a2c" stroke-width="2"/>

  <line x1="65" y1="30" x2="65" y2="60" stroke="#c98a2c" stroke-width="2"/>
  <line x1="75" y1="30" x2="75" y2="60" stroke="#8b3a2b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="85" y1="30" x2="85" y2="60" stroke="#c98a2c" stroke-width="3"/>
</svg>
