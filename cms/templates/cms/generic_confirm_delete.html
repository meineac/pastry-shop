{% extends 'core/base.html' %}

{% block title %}{{ title }} — Pastry Shop{% endblock %}

{% block content %}
<div class="admin-form-container">
    <div class="admin-form-card" style="text-align: center;">
        <h1 style="color: #b91c1c;">{{ title }}</h1>

        <p style="font-size: 1.1rem; margin: 1.5rem 0;">Are you sure you want to delete "<strong>{{ object }}</strong>"?</p>
        <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 2rem;">This item will be permanently removed.</p>

        <form method="POST" style="display: flex; justify-content: center; gap: 1rem;">
            {% csrf_token %}
            <a href="{% url cancel_url %}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-action-small btn-danger" style="height: 44px; padding: 0 1.75rem;">Confirm Delete</button>
        </form>
    </div>
</div>
{% endblock %}
