{% extends 'core/base.html' %}

{% block content %}
    <h1>{{ title }}</h1>

    <p>Are you sure you want to delete "{{ object }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url cancel_url %}">Cancel</a>
{% endblock %}
