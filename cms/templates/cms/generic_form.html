{% extends 'core/base.html' %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="javascript:history.back()">Cancel</a>
{% endblock %}
