<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Pastry Shop{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a> |
            {% if request.user.is_authenticated %}
                <a href="{% url 'profile' %}">Profile</a> |
                {% if request.user.role == 'ADMIN' or request.user.role == 'STAFF' or request.user.is_superuser %}
                    <a href="{% url 'staff_list' %}">Staff</a> |
                {% endif %}
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a> |
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        <p>&copy; 2025 Pastry Shop</p>
    </footer>
</body>
</html>
