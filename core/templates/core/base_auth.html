{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pastry Shop — account access">
    <link rel="icon" href="/media/company/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <title>{% block title %}Auth — Pastry Shop{% endblock %}</title>
</head>
<body class="auth-page">
    <header class="auth-header">
        <a href="{% url 'cms:home' %}" class="brand-link">
            <span class="brand-logo-icon" aria-hidden="true">🥐</span>
            <span class="brand-title">Pastry Shop</span>
        </a>
    </header>
    <main class="site-main auth-main">
        {% block content %}
        {% endblock content %}
    </main>
</body>
</html>
