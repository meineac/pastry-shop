<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <g fill="none" stroke="#9e7a46" stroke-width="1.8" opacity="0.16">
    <!-- Concentric Circles with Dash Pattern -->
    <circle cx="200" cy="200" r="180" stroke-width="3"/>
    <circle cx="200" cy="200" r="168" stroke-dasharray="4 4" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="130"/>
    <circle cx="200" cy="200" r="120" stroke-dasharray="2 3"/>

    <!-- 16-Point Starburst Behind Emblem -->
    <path d="M 200,40 L 206,120 L 260,60 L 225,130 L 310,100 L 245,150 L 340,160 L 255,185 L 340,240 L 250,225 L 310,300 L 225,270 L 260,340 L 206,280 L 200,360 L 194,280 L 140,340 L 175,270 L 90,300 L 150,225 L 60,240 L 145,185 L 60,160 L 155,150 L 90,100 L 175,130 L 140,60 L 194,120 Z" stroke-width="1"/>

    <!-- Central Pastry Icon (Toque Chef Hat and Wheat Sheaves) -->
    <!-- Chef Hat -->
    <path d="M 170,190 C 160,170 150,150 170,135 C 190,120 210,120 230,135 C 250,150 240,170 230,190 Z" fill="#9e7a46" fill-opacity="0.08"/>
    <rect x="175" y="190" width="50" height="15" rx="3" fill="#9e7a46" fill-opacity="0.12"/>
    
    <!-- Laurel / Wheat Sheaves -->
    <path d="M 140,230 C 130,190 145,160 160,140" stroke-width="2"/>
    <circle cx="140" cy="180" r="4" fill="#9e7a46" fill-opacity="0.2"/>
    <circle cx="148" cy="160" r="4" fill="#9e7a46" fill-opacity="0.2"/>
    <circle cx="158" cy="144" r="4" fill="#9e7a46" fill-opacity="0.2"/>

    <path d="M 260,230 C 270,190 255,160 240,140" stroke-width="2"/>
    <circle cx="260" cy="180" r="4" fill="#9e7a46" fill-opacity="0.2"/>
    <circle cx="252" cy="160" r="4" fill="#9e7a46" fill-opacity="0.2"/>
    <circle cx="242" cy="144" r="4" fill="#9e7a46" fill-opacity="0.2"/>

    <!-- Ribbon Banner Below -->
    <path d="M 130,240 Q 200,255 270,240 L 260,260 Q 200,275 140,260 Z" fill="#9e7a46" fill-opacity="0.08"/>
  </g>
  <text x="200" y="254" font-family="serif" font-size="9" font-weight="bold" fill="#9e7a46" fill-opacity="0.25" text-anchor="middle" letter-spacing="2">EXCELLENCE EN PÂTISSERIE</text>
</svg>
