<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a531e"/>
      <stop offset="25%" stop-color="#dfaa57"/>
      <stop offset="50%" stop-color="#fae392"/>
      <stop offset="75%" stop-color="#c98a39"/>
      <stop offset="100%" stop-color="#724115"/>
    </linearGradient>
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c52"/>
      <stop offset="100%" stop-color="#2a4b82"/>
    </linearGradient>
  </defs>

  <!-- Outer Double Framing Lines (Outer rect at 6, Inner rect at 16) -->
  <rect x="6" y="6" width="288" height="288" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="14" y="14" width="272" height="272" fill="none" stroke="url(#royalBlue)" stroke-width="2"/>
  <rect x="20" y="20" width="260" height="260" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Top Edge Middle Filigree (Between 60 and 240) -->
  <path d="M 60,10 Q 150,22 240,10" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="150" cy="14" r="4" fill="url(#gold)"/>
  
  <!-- Bottom Edge Middle Filigree -->
  <path d="M 60,290 Q 150,278 240,290" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="150" cy="286" r="4" fill="url(#gold)"/>

  <!-- Left Edge Middle Filigree -->
  <path d="M 10,60 Q 22,150 10,240" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="14" cy="150" r="4" fill="url(#gold)"/>

  <!-- Right Edge Middle Filigree -->
  <path d="M 290,60 Q 278,150 290,240" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="286" cy="150" r="4" fill="url(#gold)"/>

  <!-- TOP-LEFT CORNER (0-60, 0-60) -->
  <g id="corner-tl">
    <rect x="4" y="4" width="54" height="54" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 8,8 L 52,8 Q 28,28 8,52 Z" fill="#2a4b82" opacity="0.35"/>
    <path d="M 12,12 Q 38,12 48,22 Q 22,48 12,12 Z" fill="url(#gold)" opacity="0.6"/>
    <circle cx="24" cy="24" r="8" fill="url(#gold)"/>
    <circle cx="24" cy="24" r="4" fill="#142c52"/>
    <path d="M 4,45 Q 26,26 45,4" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 4,55 Q 32,32 55,4" fill="none" stroke="url(#royalBlue)" stroke-width="2"/>
  </g>

  <!-- TOP-RIGHT CORNER (240-300, 0-60) -->
  <g id="corner-tr" transform="translate(300, 0) scale(-1, 1)">
    <rect x="4" y="4" width="54" height="54" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 8,8 L 52,8 Q 28,28 8,52 Z" fill="#2a4b82" opacity="0.35"/>
    <path d="M 12,12 Q 38,12 48,22 Q 22,48 12,12 Z" fill="url(#gold)" opacity="0.6"/>
    <circle cx="24" cy="24" r="8" fill="url(#gold)"/>
    <circle cx="24" cy="24" r="4" fill="#142c52"/>
    <path d="M 4,45 Q 26,26 45,4" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 4,55 Q 32,32 55,4" fill="none" stroke="url(#royalBlue)" stroke-width="2"/>
  </g>

  <!-- BOTTOM-LEFT CORNER (0-60, 240-300) -->
  <g id="corner-bl" transform="translate(0, 300) scale(1, -1)">
    <rect x="4" y="4" width="54" height="54" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 8,8 L 52,8 Q 28,28 8,52 Z" fill="#2a4b82" opacity="0.35"/>
    <path d="M 12,12 Q 38,12 48,22 Q 22,48 12,12 Z" fill="url(#gold)" opacity="0.6"/>
    <circle cx="24" cy="24" r="8" fill="url(#gold)"/>
    <circle cx="24" cy="24" r="4" fill="#142c52"/>
    <path d="M 4,45 Q 26,26 45,4" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 4,55 Q 32,32 55,4" fill="none" stroke="url(#royalBlue)" stroke-width="2"/>
  </g>

  <!-- BOTTOM-RIGHT CORNER (240-300, 240-300) -->
  <g id="corner-br" transform="translate(300, 300) scale(-1, -1)">
    <rect x="4" y="4" width="54" height="54" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 8,8 L 52,8 Q 28,28 8,52 Z" fill="#2a4b82" opacity="0.35"/>
    <path d="M 12,12 Q 38,12 48,22 Q 22,48 12,12 Z" fill="url(#gold)" opacity="0.6"/>
    <circle cx="24" cy="24" r="8" fill="url(#gold)"/>
    <circle cx="24" cy="24" r="4" fill="#142c52"/>
    <path d="M 4,45 Q 26,26 45,4" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 4,55 Q 32,32 55,4" fill="none" stroke="url(#royalBlue)" stroke-width="2"/>
  </g>
</svg>
