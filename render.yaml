# ---------------------------------------------------------------------------
# Pastry Shop — Render Blueprint
# ---------------------------------------------------------------------------
# This file defines the Render services for one-click deployment.
# Docs: https://render.com/docs/blueprint-spec
# ---------------------------------------------------------------------------

services:
  # ── Web Application ────────────────────────────────────────────────────────
  - type: web
    name: pastry-shop-web
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_all"
    startCommand: "gunicorn pastry_shop.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pastry-shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: LOG_LEVEL
        value: "INFO"
      - key: IPINFO_TOKEN
        sync: false          # Set manually in Render dashboard
      - key: OPENWEATHER_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: TEST_IP
        value: "8.8.8.8"
      - key: SUPERUSER_USERNAME
        value: "admin"
      - key: SUPERUSER_EMAIL
        value: "admin@example.com"
      - key: SUPERUSER_PASSWORD
        sync: false          # Set manually in Render dashboard

# ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: pastry-shop-db
    databaseName: pastry_shop
    region: frankfurt
    plan: free
